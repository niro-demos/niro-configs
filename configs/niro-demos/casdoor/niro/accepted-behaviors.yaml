# accepted-behaviors.yaml — a risk-acceptance register.
#
# Every entry is a behavior treated as ACCEPTED: as long as an entry exists, the
# tool considers that behavior intended and does not re-report it. To stop
# accepting one, delete it — the finding comes back. Version control records who
# changed what, and when.
#
#   consequence:  [tool] the precise risk, in plain terms a non-expert can
#                 evaluate — what could actually happen. (max 1000 runes)
#   evidence:     [tool] proof it looks intentional — comment / test / flag /
#                 code, by file:line.
#   reason:       [human] your team's rationale for accepting this — your own
#                 documentation. The tool never writes it, and an entry is
#                 accepted by being here, not by this field. But fill it in: an
#                 undocumented acceptance no one can explain later is how real
#                 risk quietly gets forgotten.
#
# Be specific enough to adjudicate in seconds. Vague entries hide real bugs.
#
# This file accumulates across runs and is APPEND-ONLY. Anyone updating it — tool
# or human — must read it first, keep every existing entry (especially the human
# `reason`), and only append; never rewrite, reorder, or drop entries. Presence
# is the suppression signal, so a clobbered entry silently un-accepts a finding.
# COMMIT it to git — that is your history, your review trail, and your undo.

accepted_behaviors:
  - consequence: "An unauthenticated internet user can confirm whether supplied email addresses have accounts through the public WebFinger endpoint."
    evidence: "authz/authz.go:103 allows public GET /.well-known/webfinger; object/wellknown_oidc_discovery.go:257-264 intentionally handles acct resources by looking up the email and returning user not found when absent."
  - consequence: "A buyer can mark an order paid without a provider-verified charge when the product uses the built-in dummy payment provider."
    evidence: "pp/dummy.go:35-38 documents DummyPaymentProvider as a test/mock provider; object/init.go:327-352 creates provider_payment_dummy as a built-in payment provider."
  - consequence: "An unauthenticated user can confirm whether a supplied username exists in an organization and receive masked recovery contact hints through the password-recovery contact lookup."
    evidence: "authz/authz.go:48 allows public GET /api/get-email-and-phone; web/src/auth/ForgetPage.js:86-123 intentionally calls it before verification to choose a password-recovery method."
  - consequence: "An unauthenticated caller can determine whether a given org/username exists, and for existing accounts whether WebAuthn or Face ID passwordless login is enrolled, via the WebAuthn and Face ID sign-in start endpoints."
    evidence: "authz/authz.go:116 and :135 allow public GET on /api/webauthn/* and /api/faceid-signin-begin; controllers/webauthn.go:145-152 and controllers/face.go:44-52 intentionally return distinct 'user doesn't exist' vs 'no credentials enrolled' messages; web/src/auth/LoginPage.js:451-464 (Face ID) and :1358-1363 (WebAuthn) deliberately read res.msg / credentialRequestOptions.msg and surface it verbatim to the end user as sign-in guidance. The same message differentiation is core, pre-existing behavior of the primary password login path itself (object/check.go:376-378 in CheckUserPassword returns 'The user: %s doesn't exist' distinctly from 'password or code is incorrect' for POST /api/login), confirmed live: curl -s -X POST http://127.0.0.1:18000/api/login with a bad password for an existing user returns 'password or code is incorrect, you have N remaining chances', while a nonexistent username returns 'The user: .../... doesn't exist' — showing this is consistent, intentional app-wide design (already partially accepted above for /api/get-email-and-phone) rather than an oversight isolated to the WebAuthn/Face ID code."
  - consequence: "An unauthenticated caller can determine whether a given org/username exists, and for existing accounts can read back the exact number of remaining login attempts before lockout, through the primary password-login endpoint (POST /api/login)."
    evidence: "object/check.go:376-378 (CheckUserPassword) returns a distinct 'general:The user: %s doesn't exist' error when GetUserByFields finds no account, while the wrong-password branch calls recordSigninErrorInfo (object/check_util.go:73-107), which returns 'check:password or code is incorrect, you have %s remaining chances' — both reached from the same POST /api/login handler (controllers/auth.go:786 calls CheckUserPassword from Login()). The remaining-chances count is computed from the per-application, admin-configurable FailedSigninLimit/FailedSigninFrozenTime lockout policy (GetFailedSigninConfigByUser, object/check_util.go:51-70), i.e. deliberate lockout-countdown UX rather than an oversight, and the same code path/verdict already covers the parallel accepted entry above for /api/get-email-and-phone and the WebAuthn/Face ID sign-in-start endpoints, which explicitly confirmed this exact /api/login behavior live."
