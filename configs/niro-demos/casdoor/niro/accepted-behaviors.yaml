# accepted-behaviors.yaml — a risk-acceptance register.
#
# Every entry is a behavior treated as ACCEPTED: as long as an entry exists, the
# tool considers that behavior intended and does not re-report it. To stop
# accepting one, delete it — the finding comes back. Version control records who
# changed what, and when.
#
#   consequence:  [tool] the precise risk, in plain terms a non-expert can
#                 evaluate — what could actually happen. (max 1000 runes)
#   evidence:     [tool] proof it looks intentional — comment / test / flag /
#                 code, by file:line.
#   reason:       [human] your team's rationale for accepting this — your own
#                 documentation. The tool never writes it, and an entry is
#                 accepted by being here, not by this field. But fill it in: an
#                 undocumented acceptance no one can explain later is how real
#                 risk quietly gets forgotten.
#
# Be specific enough to adjudicate in seconds. Vague entries hide real bugs.
#
# This file accumulates across runs and is APPEND-ONLY. Anyone updating it — tool
# or human — must read it first, keep every existing entry (especially the human
# `reason`), and only append; never rewrite, reorder, or drop entries. Presence
# is the suppression signal, so a clobbered entry silently un-accepts a finding.
# COMMIT it to git — that is your history, your review trail, and your undo.

accepted_behaviors:
  - consequence: "An unauthenticated internet user can confirm whether supplied email addresses have accounts through the public WebFinger endpoint."
    evidence: "authz/authz.go:103 allows public GET /.well-known/webfinger; object/wellknown_oidc_discovery.go:257-264 intentionally handles acct resources by looking up the email and returning user not found when absent."
  - consequence: "A buyer can mark an order paid without a provider-verified charge when the product uses the built-in dummy payment provider."
    evidence: "pp/dummy.go:35-38 documents DummyPaymentProvider as a test/mock provider; object/init.go:327-352 creates provider_payment_dummy as a built-in payment provider."
  - consequence: "An unauthenticated user can confirm whether a supplied username exists in an organization and receive masked recovery contact hints through the password-recovery contact lookup."
    evidence: "authz/authz.go:48 allows public GET /api/get-email-and-phone; web/src/auth/ForgetPage.js:86-123 intentionally calls it before verification to choose a password-recovery method."
  - consequence: "An administrator who deletes a user's session record for an application other than Casdoor's built-in application does not terminate that user's existing authenticated browser session."
    evidence: "object/session.go:170-194 deliberately calls DeleteBeegoSession only when the session belongs to the built-in organization and app-built-in; object/session.go:208-220 applies the same explicit restriction when deleting one tracked session ID."
  - consequence: "When Casdoor is deployed with Beego's development run mode enabled, an authenticated administrator can receive internal source paths and call stacks by uploading a malformed role or permission import; whether customer production deployments retain this development setting is not established by the local target."
    evidence: "conf/app.conf:3 explicitly configures runmode = dev; xlsx/xlsx.go:19-23 deliberately panics when the uploaded workbook cannot be opened, allowing Beego's development error page to render the panic stack."
  - consequence: "Anyone holding a user's refresh token can obtain new access and refresh tokens for a secret-bearing application without supplying that application's client secret."
    evidence: "controllers/token.go:373-401 documents client_secret as optional and deliberately calls ValidateOAuth(true), which bypasses secret comparison; object/token_oauth_util.go:393-422 rejects only a non-empty incorrect client secret."
  - consequence: "When Casdoor is deployed with Beego's development run mode enabled, an organization administrator can expose internal source paths and call stacks by requesting group removal for a nonexistent user; whether customer production deployments retain this development setting is not established by the local target."
    evidence: "conf/app.conf:3 explicitly configures runmode = dev; object/user.go:1362-1374 dereferences the result of GetUser without handling a nonexistent user, allowing Beego's development error page to render the panic stack."
  - consequence: "An organization administrator can configure a webhook to receive activity payloads from other organizations, including private ticket content."
    evidence: "web/src/WebhookEditPage.js:331-340 exposes Single org only as an editable webhook switch; object/record.go:235-253 deliberately applies the organization match only when that switch is enabled, so a disabled switch selects records instance-wide."
  - consequence: "When Casdoor's cleartext HTTP listener is exposed without an HTTPS-only CasWAF site or another TLS-terminating frontend, authenticated session cookies can traverse the network without the Secure attribute; whether customer production deployments expose that listener is not established by the local target."
    evidence: "service/proxy.go:58-84 deliberately adds Secure and HSTS only to TLS responses; service/proxy.go:209-215 provides an explicit per-site HTTPS Only mode that redirects cleartext requests before proxying."
  - consequence: "An organization administrator can configure Casdoor's MCP gateway to connect to and relay responses from services on Casdoor's internal network."
    evidence: "controllers/server_sync.go:26-34 explicitly defines an admin-only operation to scan intranet IP/CIDR targets for MCP servers; scan/intranet_server.go:64-118 deliberately probes those private hosts, and controllers/mcp_server.go:28-35 documents proxying requests to a configured MCP server URL."
  - consequence: "An unauthenticated visitor can enumerate the roles assigned to any named user and the protected object and action names exposed through those roles."
    evidence: "authz/authz.go:129-131 explicitly allows anonymous GET access to all three capability-summary routes; controllers/casbin_api.go:316-384 deliberately accepts a supplied userId and requires login only when userId is omitted."
  - consequence: "An organization administrator can trigger replacement of the server-wide Casbin CLI engine binaries used by every tenant."
    evidence: "controllers/cli_downloader.go:449-497 explicitly authorizes RefreshEngines for any IsAdmin caller, validates its public timestamp/hash identifier, and then calls the shared downloadCLI operation; authz/authz.go:133 exposes the refresh route and delegates authorization to the handler."
  - consequence: "An unauthenticated visitor can determine whether a supplied username exists and retrieve that user's associated application metadata through the user-application lookup."
    evidence: "authz/authz.go:72 explicitly allows anonymous GET /api/get-user-application; controllers/application.go:120-147 deliberately looks up the supplied user ID, returns a distinct not-found error, and returns the user's application when found."
  - consequence: "When an organization enables public user profiles, an unauthenticated visitor can retrieve identified users' profile and account metadata, including contact details, password salt, registration IP, and multifactor-authentication configuration, subject to that organization's account-field visibility rules."
    evidence: "authz/authz.go:71 explicitly allows anonymous GET /api/get-user; controllers/user.go:200-245 deliberately permits the lookup when Organization.IsProfilePublic is enabled and applies GetMaskedUser plus organization AccountItems visibility; object/user.go:669-719 and 722-775 define the masking and configured field filtering."
